_schema-version: "3.1"
ID: vendor-recon
version: 1.0.0
description: Enterprise Vendor Reconciliation System

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder:
        custom:
          commands:
            - npm ci
            - npx cds build --production

modules:
  - name: vendor-recon-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    properties:
      PORT: 4004
      NODE_ENV: production
    requires:
      - name: vendor-recon-db
      - name: vendor-recon-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: vendor-recon-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: vendor-recon-db

  - name: vendor-recon-app
    type: approuter.nodejs
    path: app
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 256M
    requires:
      - name: vendor-recon-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: vendor-recon-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: vendor-recon-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
